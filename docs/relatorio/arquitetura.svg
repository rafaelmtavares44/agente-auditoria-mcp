<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, Arial, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <!-- fronteira local -->
  <rect x="8" y="8" width="560" height="284" rx="10" fill="none" stroke="#999" stroke-dasharray="6 4"/>
  <text x="18" y="26" fill="#555" font-weight="bold">Máquina local</text>
  <!-- nuvem -->
  <rect x="590" y="40" width="160" height="80" rx="10" fill="#fdf1e3" stroke="#c77b30"/>
  <text x="670" y="72" text-anchor="middle" font-weight="bold">API Anthropic</text>
  <text x="670" y="90" text-anchor="middle">(nuvem · inferência)</text>
  <text x="670" y="106" text-anchor="middle" fill="#555">claude-sonnet-5</text>

  <!-- CLI -->
  <rect x="24" y="50" width="100" height="50" rx="8" fill="#eef3fb" stroke="#4a6fa5"/>
  <text x="74" y="80" text-anchor="middle" font-weight="bold">CLI</text>
  <!-- Orquestrador -->
  <rect x="160" y="40" width="190" height="70" rx="8" fill="#eef3fb" stroke="#4a6fa5"/>
  <text x="255" y="64" text-anchor="middle" font-weight="bold">Orquestrador</text>
  <text x="255" y="81" text-anchor="middle">histórico · limites · status</text>
  <text x="255" y="97" text-anchor="middle">allowlist + JSON Schema</text>
  <!-- Logs e validadores -->
  <rect x="380" y="40" width="170" height="30" rx="6" fill="#f4f4f4" stroke="#888"/>
  <text x="465" y="60" text-anchor="middle">Logs JSONL (sanitizados)</text>
  <rect x="380" y="80" width="170" height="30" rx="6" fill="#f4f4f4" stroke="#888"/>
  <text x="465" y="100" text-anchor="middle">Validadores de artefatos</text>
  <!-- Cliente MCP -->
  <rect x="160" y="140" width="190" height="36" rx="8" fill="#eef3fb" stroke="#4a6fa5"/>
  <text x="255" y="163" text-anchor="middle" font-weight="bold">Cliente MCP</text>
  <!-- Servidor MCP -->
  <rect x="160" y="210" width="190" height="66" rx="8" fill="#eaf6ee" stroke="#3c8d5a"/>
  <text x="255" y="232" text-anchor="middle" font-weight="bold">Servidor MCP (subprocesso)</text>
  <text x="255" y="249" text-anchor="middle">5 ferramentas · path_guard</text>
  <text x="255" y="265" text-anchor="middle">sanitização · AST</text>
  <!-- Arquivos -->
  <rect x="390" y="196" width="160" height="34" rx="6" fill="#fff" stroke="#3c8d5a"/>
  <text x="470" y="217" text-anchor="middle">legacy_sample/ (leitura)</text>
  <rect x="390" y="242" width="160" height="34" rx="6" fill="#fff" stroke="#3c8d5a"/>
  <text x="470" y="263" text-anchor="middle">output/&lt;run_id&gt;/ (escrita)</text>
  <!-- gabarito -->
  <rect x="24" y="226" width="110" height="46" rx="6" fill="#fff" stroke="#b33" stroke-dasharray="4 3"/>
  <text x="79" y="246" text-anchor="middle">evaluation/</text>
  <text x="79" y="262" text-anchor="middle" fill="#b33">fora da raiz</text>

  <!-- setas -->
  <line x1="124" y1="75" x2="158" y2="75" stroke="#333" marker-end="url(#a)"/>
  <line x1="350" y1="55" x2="378" y2="55" stroke="#333" marker-end="url(#a)"/>
  <line x1="350" y1="95" x2="378" y2="95" stroke="#333" marker-end="url(#a)"/>
  <path d="M350,48 C470,20 540,40 588,62" fill="none" stroke="#c77b30" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="395" y="10" width="190" height="18" fill="#fff"/><text x="490" y="23" text-anchor="middle" fill="#c77b30">HTTPS: mensagens, tools, tool_result</text>
  <line x1="255" y1="110" x2="255" y2="138" stroke="#333" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="255" y1="176" x2="255" y2="208" stroke="#3c8d5a" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="262" y="197" fill="#3c8d5a">JSON-RPC via stdio</text>
  <line x1="350" y1="228" x2="388" y2="213" stroke="#333" marker-end="url(#a)"/>
  <line x1="350" y1="258" x2="388" y2="259" stroke="#333" marker-end="url(#a)"/>
  <line x1="136" y1="249" x2="158" y2="243" stroke="#b33" stroke-dasharray="4 3"/>
  <text x="147" y="232" text-anchor="middle" fill="#b33" font-size="16">✕</text>
</svg>
